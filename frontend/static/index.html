<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriCoach AI — Monochrome Endurance Engine</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
  :root {
    --bg-black: #09090b;
    --surface-dark: #121215;
    --surface-card: #18181b;
    --border-dark: #27272a;
    --border-light: #3f3f46;
    --text-white: #ffffff;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --mono-font: 'Space Mono', monospace;
    --sans-font: 'Space Grotesk', sans-serif;
    --heading-font: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans-font);
    background-color: var(--bg-black);
    color: var(--text-white);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Structural Grid Lines */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    background: rgba(9, 9, 11, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-dark);
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    background: #ffffff;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #09090b;
    font-weight: 700;
  }

  .brand-logo .material-symbols-outlined {
    color: #09090b !important;
    font-size: 1.25rem;
    font-weight: 700;
  }

  .brand-title {
    font-family: var(--heading-font);
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-white);
  }

  .brand-tagline {
    font-family: var(--mono-font);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-white);
    padding: 0.35rem 0.85rem;
    border-radius: 2px;
    font-family: var(--mono-font);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: #ffffff;
    border-radius: 50%;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
    z-index: 1;
  }

  /* --- Architectural Dialogue Layout --- */
  .msg {
    display: flex;
    flex-direction: column;
    margin-bottom: 0.5rem;
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono-font);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .msg.user .msg-meta {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 24px;
    height: 24px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-family: var(--mono-font);
    font-weight: 700;
  }

  .msg-avatar.agent-avatar {
    background: #ffffff;
    color: #09090b;
  }

  .msg-avatar.user-avatar {
    background: var(--surface-card);
    border: 1px solid var(--border-light);
    color: #ffffff;
  }

  .msg-author {
    font-weight: 600;
    color: var(--text-white);
  }

  .msg-time {
    color: var(--text-dim);
    font-size: 0.68rem;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 0.6rem;
    width: 100%;
  }

  .msg.user .msg-row { justify-content: flex-end; }
  .msg.agent .msg-row { justify-content: flex-start; }

  .bubble {
    padding: 1rem 1.25rem;
    border-radius: 4px;
    background: var(--surface-card);
    border: 1px solid var(--border-dark);
    color: var(--text-white);
    max-width: 85%;
    line-height: 1.6;
    font-size: 0.92rem;
    letter-spacing: 0.01em;
    position: relative;
  }

  .msg.user .bubble {
    background: #ffffff;
    color: #09090b;
    border: 1px solid #ffffff;
    border-bottom-right-radius: 0px;
    font-weight: 500;
  }

  .msg.agent .bubble {
    background: var(--surface-card);
    color: #f4f4f5;
    border: 1px solid var(--border-dark);
    border-left: 3px solid #ffffff;
    border-bottom-left-radius: 0px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
  }

  form {
    padding: 1.25rem 2rem 1.5rem;
    background: rgba(9, 9, 11, 0.98);
    border-top: 1px solid var(--border-dark);
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    z-index: 10;
  }

  .prompts-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    width: 100%;
  }

  .prompt-chip {
    background: var(--surface-dark);
    border: 1px solid var(--border-dark);
    color: var(--text-muted);
    padding: 0.65rem 0.85rem;
    border-radius: 2px;
    font-family: var(--mono-font);
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .prompt-chip:hover {
    border-color: #ffffff;
    background: #ffffff;
    color: #09090b;
  }

  .prompt-chip:hover span {
    color: #09090b;
  }

  .input-row {
    display: flex;
    gap: 0.75rem;
    width: 100%;
  }

  .input-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 0.9rem 1.1rem;
    background: var(--surface-dark);
    border: 1px solid var(--border-dark);
    border-radius: 2px;
    color: var(--text-white);
    font-family: var(--sans-font);
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input::placeholder {
    color: var(--text-dim);
    font-family: var(--mono-font);
    font-size: 0.82rem;
  }

  input:focus {
    border-color: #ffffff;
    background: #000000;
  }

  button.submit-btn {
    padding: 0.9rem 1.5rem;
    border: 1px solid #ffffff;
    border-radius: 2px;
    background: #ffffff;
    color: #09090b;
    font-family: var(--mono-font);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  button.submit-btn:hover {
    background: #09090b;
    color: #ffffff;
    border-color: #ffffff;
  }

  button.submit-btn:hover .material-symbols-outlined {
    color: #ffffff !important;
  }

  /* --- Architectural A2UI Card Styles --- */
  .a2card {
    background: var(--surface-dark);
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    padding: 1.25rem;
    margin-top: 0.6rem;
  }

  .a2col { display: flex; flex-direction: column; gap: 0.65rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.85rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-white); }
  .a2text.a2-h1 { font-family: var(--heading-font); font-size: 1.4rem; font-weight: 800; letter-spacing: 0.03em; color: #ffffff; text-transform: uppercase; }
  .a2text.a2-h2 { font-family: var(--heading-font); font-size: 1.2rem; font-weight: 700; color: #ffffff; }
  .a2text.a2-h3 { font-family: var(--sans-font); font-size: 1.05rem; font-weight: 600; color: #e4e4e7; }
  .a2text.a2-h4 { font-family: var(--sans-font); font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-family: var(--mono-font); font-size: 0.78rem; color: var(--text-muted); }

  .a2divider { border: none; border-top: 1px solid var(--border-dark); margin: 0.75rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 2px; display: block; border: 1px solid var(--border-dark); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.2rem; line-height: 1; vertical-align: middle; color: #ffffff; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">
      <span class="material-symbols-outlined">directions_bike</span>
    </div>
    <div>
      <div class="brand-title">TRICOACH AI</div>
      <div class="brand-tagline">MONOCHROME ENDURANCE ENGINE</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div> ENGINE ONLINE
  </div>
</header>

<div id="log"></div>

<form id="form">
  <div class="prompts-bar">
    <button type="button" class="prompt-chip" onclick="sendPrompt('What triathlon workouts are available in my catalog?')">
      <span>[01]</span>
      <span>Browse Workouts</span>
    </button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('Calculate my target heart rate training zones with Max HR 185 and Resting HR 55')">
      <span>[02]</span>
      <span>Calculate HR Zones</span>
    </button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('Generate a motivational visual of a triathlete cycling on a scenic coastal road')">
      <span>[03]</span>
      <span>Race Goal Poster</span>
    </button>
  </div>
  <div class="input-row">
    <div class="input-wrapper">
      <input id="input" placeholder="// Ask TriCoach about workouts, HR zones, weather, visuals..." autocomplete="off" autofocus>
    </div>
    <button type="submit" class="submit-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="color:#09090b; font-size:1rem;">send</span>
    </button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function getCurrentTimeStr() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bubble(who) {
  const m = el("div", "msg " + who);
  
  const meta = el("div", "msg-meta");
  if (who === "agent") {
    const av = el("div", "msg-avatar agent-avatar");
    av.innerHTML = '<span class="material-symbols-outlined" style="font-size:0.9rem; color:#0b0f19;">directions_bike</span>';
    meta.appendChild(av);
    meta.appendChild(el("span", "msg-author", "TriCoach AI"));
  } else {
    const av = el("div", "msg-avatar user-avatar", "YOU");
    meta.appendChild(av);
    meta.appendChild(el("span", "msg-author", "You"));
  }
  meta.appendChild(el("span", "msg-time", getCurrentTimeStr()));
  m.appendChild(meta);

  const row = el("div", "msg-row");
  const b = el("div", "bubble");
  row.appendChild(b);
  m.appendChild(row);

  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit'));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
